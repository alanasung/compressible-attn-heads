# @package _global_
#
# The end-to-end run that must finish on the local M4. GPT-2 small is the E01
# subject (fused QKV surgery). Measured path is the pilot default.

defaults:
  - base_experiment
  - override /model: gpt2
  - override /data: pilot
  - override /eval: fast
  - override /run: pilot
  - _self_

experiment:
  name: pilot
  task_id: E02
  description: >
    E01 substitutability on loaded GPT-2 attentions; structural fused-QKV
    surgery with masking≠removal contrast; real next-token perplexity.
  stages: [build_dataset, collect, fit, evaluate, report]
  tags: [pilot, local, gpt2]

model:
  batch_size: 8

force_synthetic: false

cache:
  namespace: pilot
